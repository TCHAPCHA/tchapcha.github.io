<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/icon/icon.png">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="Privacy Policy and Terms of Use for AI OBD2 Diagnostic.">
  <title>Policies | AI OBD2 Diagnostic</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #edf3f8;
      background: #0b1118;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #a8b7c7;
      --line: #263642;
      --accent: #69d6df;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; line-height: 1.7; }
    a { color: var(--accent); }
    .page { width: min(860px, calc(100% - 36px)); margin: 0 auto; padding: 34px 0 64px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 52px; }
    .brand { color: #f5f8fb; font-size: 15px; font-weight: 700; text-decoration: none; }
    .back { color: var(--muted); font-size: 14px; text-decoration: none; }
    .back:hover, a:hover { color: #fff; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 54px); letter-spacing: -.045em; line-height: 1.1; }
    .intro { margin: 14px 0 28px; color: var(--muted); }
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 22px; }
    .tab { padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: #101a23; font: inherit; cursor: pointer; transition: border-color .2s, color .2s, background .2s; }
    .tab:hover { border-color: #438d98; color: #fff; }
    .tab[aria-selected="true"] { border-color: var(--accent); color: #071116; background: var(--accent); }
    article { min-height: 300px; padding: clamp(22px, 5vw, 42px); border: 1px solid var(--line); border-radius: 20px; background: #101820; }
    article h1 { margin: 0 0 24px; font-size: clamp(27px, 5vw, 38px); }
    article h2 { margin: 34px 0 10px; font-size: 22px; letter-spacing: -.02em; }
    article h3 { margin: 26px 0 8px; font-size: 18px; }
    article p, article ul, article ol { margin: 0 0 17px; color: #d2dce5; }
    article li { margin: 5px 0; padding-left: 4px; }
    article strong { color: #fff; }
    article code { padding: 2px 6px; border: 1px solid #2c3b47; border-radius: 5px; color: #c9eef0; background: #0b1218; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .9em; }
    article a { text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .status { color: var(--muted); }
    .status[hidden], article[hidden] { display: none; }
    footer { margin-top: 24px; color: var(--muted); font-size: 13px; }
    @media (max-width: 520px) { .page { padding-top: 22px; } .top { margin-bottom: 38px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="brand" href="index.html">AI OBD2 Diagnostic</a>
      <a class="back" href="index.html">Back to website</a>
    </header>
    <main>
      <p class="eyebrow">Legal information</p>
      <h1>Policies</h1>
      <p class="intro">Read how the app handles information and the terms that apply when you use it.</p>
      <nav class="tabs" aria-label="Select a document">
        <button class="tab" id="privacy-tab" type="button" role="tab" aria-controls="privacy-document">Privacy Policy</button>
        <button class="tab" id="terms-tab" type="button" role="tab" aria-controls="terms-document">Terms of Use</button>
      </nav>
      <p class="status" id="status" role="status">Loading documentвЂ¦</p>
      <article id="privacy-document" aria-labelledby="privacy-tab" hidden></article>
      <article id="terms-document" aria-labelledby="terms-tab" hidden></article>
    </main>
    <footer>AI OBD2 Diagnostic В· <a href="mailto:sergiykurylenko@gmail.com">Contact</a></footer>
  </div>
  <script>
    const documents = {
      privacy: { file: "privacy-policy.md", tab: "privacy-tab", panel: "privacy-document" },
      terms: { file: "terms-of-use.md", tab: "terms-tab", panel: "terms-document" }
    };

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[character]);
    }

    function renderInline(value) {
      let html = escapeHtml(value);
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      return html;
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r/g, "").split("\n");
      const output = [];
      let paragraph = [];
      let listType = "";
      const closeList = () => {
        if (listType) output.push(`</${listType}>`);
        listType = "";
      };
      const flushParagraph = () => {
        if (paragraph.length) output.push(`<p>${paragraph.map(renderInline).join("<br>")}</p>`);
        paragraph = [];
      };

      for (const line of lines) {
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const item = line.match(/^\s*[-*+]\s+(.+)$/);
        const numbered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (heading) {
          flushParagraph(); closeList();
          const level = heading[1].length;
          const title = heading[2];
          const id = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
          output.push(`<h${level} id="${id}">${renderInline(title)}</h${level}>`);
        } else if (item || numbered) {
          flushParagraph();
          const nextType = item ? "ul" : "ol";
          if (listType !== nextType) { closeList(); output.push(`<${nextType}>`); listType = nextType; }
          output.push(`<li>${renderInline((item || numbered)[1])}</li>`);
        } else if (!line.trim()) {
          flushParagraph(); closeList();
        } else {
          closeList(); paragraph.push(line.trim());
        }
      }
      flushParagraph(); closeList();
      return output.join("\n");
    }

    async function showDocument(name) {
      const selected = documents[name] ? name : "privacy";
      const status = document.getElementById("status");
      for (const [key, documentInfo] of Object.entries(documents)) {
        const active = key === selected;
        document.getElementById(documentInfo.tab).setAttribute("aria-selected", String(active));
        document.getElementById(documentInfo.tab).setAttribute("tabindex", active ? "0" : "-1");
        document.getElementById(documentInfo.panel).hidden = !active;
      }
      const selectedInfo = documents[selected];
      const panel = document.getElementById(selectedInfo.panel);
      if (panel.dataset.loaded === "true") { status.hidden = true; return; }
      status.hidden = false;
      status.textContent = "Loading documentвЂ¦";
      try {
        const response = await fetch(selectedInfo.file);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        panel.innerHTML = renderMarkdown(await response.text());
        panel.dataset.loaded = "true";
        status.hidden = true;
      } catch (error) {
        status.textContent = `Could not load ${selectedInfo.file}. Make sure the Markdown file is published beside this page.`;
      }
    }

    document.getElementById("privacy-tab").addEventListener("click", () => {
      history.replaceState(null, "", "#privacy-policy"); showDocument("privacy");
    });
    document.getElementById("terms-tab").addEventListener("click", () => {
      history.replaceState(null, "", "#terms-of-use"); showDocument("terms");
    });
    const initialDocument = location.hash === "#terms-of-use" ? "terms" : "privacy";
    showDocument(initialDocument);
  </script>
</body>
</html>
